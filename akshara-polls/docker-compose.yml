services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: akshara }
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env.example
    depends_on: [postgres, redis]
    ports: ["4000:4000"]
  web:
    build: ./apps/web
    env_file: .env.example
    depends_on: [api]
    ports: ["3000:3000"]
